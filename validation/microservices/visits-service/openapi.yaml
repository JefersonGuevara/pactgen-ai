openapi: 3.0.3
info:
  title: visits-service (spring-petclinic-microservices)
  version: v3.4.1
  description: >
    Redactado a mano a partir de VisitResource y Visit del tag v3.4.1 (commit f9fd559) para el corpus
    de PactGen-AI. Consumidor real: api-gateway (VisitsServiceClient usa GET /pets/visits; el frontend
    servido por el gateway usa las otras dos operaciones a través de la ruta /api/visit/**).
    El segmento {ownerId} es un comodín en el controlador ("owners/*/pets/{petId}/visits"): cualquier valor es aceptado.
    Las restricciones @Min(1) de petId producen 400 por la validación de métodos de Spring Framework 6.1+.
paths:
  /owners/{ownerId}/pets/{petId}/visits:
    parameters:
      - name: ownerId
        in: path
        required: true
        description: Comodín; el proveedor no lo usa.
        schema: { type: integer, format: int32 }
      - name: petId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    post:
      operationId: createVisit
      summary: Registra una visita veterinaria para una mascota
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitRequest' }
      responses:
        '201':
          description: Visita creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visit' }
        '400':
          description: petId menor que 1 o descripción de más de 8192 caracteres
    get:
      operationId: findVisitsByPet
      summary: Lista las visitas de una mascota
      responses:
        '200':
          description: Visitas de la mascota (lista vacía si no tiene)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Visit' }
        '400':
          description: petId menor que 1
  /pets/visits:
    get:
      operationId: findVisitsByPets
      summary: Lista las visitas de varias mascotas
      parameters:
        - name: petId
          in: query
          required: true
          description: Identificadores separados por comas, p. ej. petId=7,8
          style: form
          explode: false
          schema:
            type: array
            items: { type: integer, format: int32 }
      responses:
        '200':
          description: Visitas de las mascotas indicadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visits' }
        '400':
          description: Falta el parámetro petId
components:
  schemas:
    VisitRequest:
      type: object
      properties:
        date: { type: string, format: date, example: '2026-11-18', description: 'Formato yyyy-MM-dd; por defecto, la fecha actual' }
        description: { type: string, maxLength: 8192, example: 'Vacunación anual' }
    Visit:
      type: object
      required: [id, date, petId]
      properties:
        id: { type: integer, format: int32, example: 1 }
        date: { type: string, format: date, example: '2026-11-18' }
        description: { type: string, example: 'Vacunación anual' }
        petId: { type: integer, format: int32, example: 7 }
    Visits:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Visit' }
